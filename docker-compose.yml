# One command:  docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - app-data:/data
    restart: unless-stopped
    # not published: only reachable through Caddy

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
