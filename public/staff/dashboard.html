<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard - Pool's Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="dashboardSidebar">
    <div class="sidebar-header">
      <img src="/images/logo.png" alt="Pool's Arena" class="sidebar-logo">
      <span class="sidebar-title">Pool's Arena</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="overview">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Overview</span>
        </a>
      <a href="#" class="nav-item" data-page="orders">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span>Orders</span>
        <span class="badge" id="ordersBadge">0</span>
      </a>
      <a href="#" class="nav-item" data-page="reservations">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Reservations</span>
        <span class="badge" id="reservationsBadge">0</span>
      </a>
      <a href="#" class="nav-item" data-page="menu">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>
        <span>Menu</span>
      </a>
      <a href="#" class="nav-item" data-page="tables">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Tables & QR</span>
      </a>
      <a href="#" class="nav-item" data-page="media">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span>Media</span>
      </a>
      <a href="#" class="nav-item" data-page="settings">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6m-12.36.36l4.24-4.24m4.24-4.24l4.24-4.24"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </aside>
  <button class="sidebar-overlay" id="sidebarOverlay" aria-label="Close navigation menu" tabindex="-1"></button>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Open navigation menu" aria-controls="dashboardSidebar" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="pageTitle">Overview</h1>
        <div class="topbar-date" id="currentDate"></div>
      </div>
      <div class="topbar-right">
        <span class="user-name" id="userName">Owner</span>
        <button class="btn-logout" id="logoutBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </div>

    <!-- Page Content -->
    <div class="page-content">
      <!-- Overview Page -->
      <div id="overviewPage" class="page active">
        <!-- Summary Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Today's Orders</div>
            <div class="stat-value" id="statTodayOrders">0</div>
            <div class="stat-change" id="statTodayOrdersChange"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Today's Revenue</div>
            <div class="stat-value" id="statTodayRevenue">0 <span class="currency">FCFA</span></div>
            <div class="stat-change" id="statTodayRevenueChange"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending Orders</div>
            <div class="stat-value" id="statPendingOrders">0</div>
            <div class="stat-meta">Awaiting action</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Upcoming Reservations</div>
            <div class="stat-value" id="statPendingReservations">0</div>
            <div class="stat-meta">Need confirmation</div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="charts-row">
          <div class="chart-card">
            <div class="chart-header">
              <h3>Revenue Over Time</h3>
              <div class="chart-controls">
                <button class="chart-btn active" data-period="7">7 Days</button>
                <button class="chart-btn" data-period="30">30 Days</button>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="revenueChart"></canvas>
            </div>
          </div>

          <div class="chart-card">
            <div class="chart-header">
              <h3>Best Selling Items</h3>
            </div>
            <div class="chart-container">
              <canvas id="topItemsChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="activity-grid">
          <div class="activity-card">
            <h3>Recent Orders</h3>
            <div id="recentOrdersList" class="activity-list"></div>
          </div>
          <div class="activity-card">
            <h3>Upcoming Reservations</h3>
            <div id="upcomingReservationsList" class="activity-list"></div>
          </div>
        </div>
      </div>

      <!-- Orders Page -->
      <div id="ordersPage" class="page">
        <div class="page-header">
          <div class="filter-tabs">
            <button class="tab-btn active" data-order-filter="all" onclick="filterOrders('all')">All</button>
            <button class="tab-btn" data-order-filter="new" onclick="filterOrders('new')">New</button>
            <button class="tab-btn" data-order-filter="preparing" onclick="filterOrders('preparing')">Preparing</button>
            <button class="tab-btn" data-order-filter="ready" onclick="filterOrders('ready')">Ready</button>
            <button class="tab-btn" data-order-filter="served" onclick="filterOrders('served')">Served</button>
          </div>
          <button class="btn-secondary" onclick="loadOrders()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
            Refresh
          </button>
        </div>
        <div id="ordersContainer" class="data-container"></div>
      </div>

      <!-- Other pages will be loaded dynamically -->
      <div id="reservationsPage" class="page"></div>
      <div id="menuPage" class="page"></div>
      <div id="tablesPage" class="page"></div>
      <div id="mediaPage" class="page"></div>
      <div id="settingsPage" class="page"></div>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-btn active" data-page="overview">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Overview</span>
    </button>
    <button class="mobile-nav-btn" data-page="orders">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span>Orders</span>
    </button>
    <button class="mobile-nav-btn" data-page="menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>
      <span>Menu</span>
    </button>
    <button class="mobile-nav-btn" data-page="settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6m-12.36.36l4.24-4.24m4.24-4.24l4.24-4.24"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <!-- Modals Container -->
  <div id="modalContainer"></div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
