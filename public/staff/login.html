<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --charcoal: #1a1a1a;
      --charcoal-light: #2a2a2a;
      --cream: #f5f3f0;
      --gold: #c9a961;
      --gold-dark: #b89750;
      --danger: #c85a54;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--charcoal) 0%, var(--charcoal-light) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: var(--cream);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--charcoal-light);
      padding: 3rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(201, 169, 97, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 80px;
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: var(--cream);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--cream);
    }

    input {
      width: 100%;
      padding: 0.875rem;
      background: var(--charcoal);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 6px;
      color: var(--cream);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.1);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--gold);
      color: var(--charcoal);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:hover:not(:disabled) {
      background: var(--gold-dark);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(200, 90, 84, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.875rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .attempts-warning {
      background: rgba(212, 161, 88, 0.1);
      border: 1px solid #d4a158;
      color: #d4a158;
      padding: 0.875rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .attempts-warning.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="/images/logo.png" alt="Pool's Arena" class="logo">
    <h1>Staff Access</h1>
    
    <div id="errorMessage" class="error-message"></div>
    <div id="attemptsWarning" class="attempts-warning"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
  </div>

  <script>
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_TIME = 15 * 60 * 1000; // 15 minutes

    // Check lockout status
    function checkLockout() {
      const lockoutUntil = localStorage.getItem('loginLockout');
      if (lockoutUntil) {
        const now = Date.now();
        if (now < parseInt(lockoutUntil)) {
          const remainingMinutes = Math.ceil((parseInt(lockoutUntil) - now) / 60000);
          showError(`Too many failed attempts. Try again in ${remainingMinutes} minute${remainingMinutes > 1 ? 's' : ''}.`);
          document.getElementById('loginBtn').disabled = true;
          return true;
        } else {
          localStorage.removeItem('loginLockout');
          localStorage.removeItem('loginAttempts');
        }
      }
      return false;
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function showAttemptsWarning(attempts) {
      const remaining = MAX_ATTEMPTS - attempts;
      if (remaining > 0 && remaining <= 2) {
        const warningEl = document.getElementById('attemptsWarning');
        warningEl.textContent = `${remaining} attempt${remaining > 1 ? 's' : ''} remaining before temporary lockout.`;
        warningEl.classList.add('show');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (checkLockout()) return;

      const errorEl = document.getElementById('errorMessage');
      const warningEl = document.getElementById('attemptsWarning');
      const loginBtn = document.getElementById('loginBtn');
      
      errorEl.classList.remove('show');
      warningEl.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const formData = new FormData(e.target);
      
      try {
        const response = await fetch('/api/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: formData.get('username'),
            password: formData.get('password')
          })
        });

        const data = await response.json();

        if (response.ok) {
          // Success - clear attempts and redirect
          localStorage.removeItem('loginAttempts');
          localStorage.removeItem('loginLockout');
          localStorage.setItem('staffToken', data.token);
          localStorage.setItem('staffUser', data.user.username);
          window.location.href = '/staff/dashboard';
        } else {
          // Failed login
          let attempts = parseInt(localStorage.getItem('loginAttempts') || '0');
          attempts++;
          localStorage.setItem('loginAttempts', attempts.toString());

          if (attempts >= MAX_ATTEMPTS) {
            const lockoutUntil = Date.now() + LOCKOUT_TIME;
            localStorage.setItem('loginLockout', lockoutUntil.toString());
            showError('Too many failed attempts. Account temporarily locked for 15 minutes.');
            loginBtn.disabled = true;
          } else {
            showError(data.error || 'Invalid credentials');
            showAttemptsWarning(attempts);
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
          }
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('Unable to connect. Please try again.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });

    // Check lockout on load
    if (checkLockout()) {
      // Check every minute if lockout has expired
      setInterval(() => {
        if (!checkLockout()) {
          document.getElementById('loginBtn').disabled = false;
          document.getElementById('errorMessage').classList.remove('show');
        }
      }, 60000);
    }
  </script>
</body>
</html>
